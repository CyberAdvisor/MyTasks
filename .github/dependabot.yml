# Dependabot version updates: once a month, one grouped pull request for npm
# packages and one for GitHub Actions, so each can be tested and merged in one go.
# Security updates come as soon as an advisory is published, separately
# (Settings › Code security › Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
