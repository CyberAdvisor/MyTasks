# Publish My Tasks at https://mytasks.fyi (NFR-13).
# Every pull request is checked, tested and built, and runs the interface
# tests; a pull request is merged only once they pass. A push to main (the
# merge) is checked, tested and built again and then deployed, without running
# the interface tests a second time on the same code: that doubled each deploy
# and a stalled GitHub machine could hold it up for half an hour (2026-11-18).
# A failing step in the build stops the deploy.
# Where it deploys: to Cloudflare (wrangler.jsonc) when the repository has the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; otherwise to GitHub
# Pages, which needs Settings › Pages › Source: GitHub Actions. A copy made by
# forking (the website's Your own copy page) has no secrets, so it uses Pages.
#
# Actions are pinned to full commit hashes (the version is in the comment),
# so a moved tag can't change what runs. Dependabot keeps them up to date.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job gets the rights to publish.
permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy mid-way.
# Pull requests get their own group, so they never hold up a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # 'true' when the Cloudflare secrets are set (secrets can't be read in a job's if).
      cloudflare: ${{ steps.host.outputs.cloudflare }}
    steps:
      - id: host
        run: echo "cloudflare=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in the packages the app ships (not the build tools).
      - run: npm audit --omit=dev
      - run: npm test
      # The Mac helpers' own tests: the Things extractor (helper/things_export.py,
      # FR-12.10) and the calendar helper (helper/calendar_sync.py, FR-21.1),
      # whose encryption needs the cryptography package (pinned here).
      - run: python3 -m pip install --user --break-system-packages cryptography==50.0.1
      - run: python3 -m unittest discover helper
      - run: npm run check
      - run: npm run build
      - if: github.event_name != 'pull_request' && steps.host.outputs.cloudflare != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Whether a pull request changes only the website and docs
  # (scripts/websiteOnly.mjs); if so, the interface tests are skipped, which
  # the main branch rule accepts as passing.
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      website_only: ${{ steps.files.outputs.website_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed.txt
          echo "website_only=$(node scripts/websiteOnly.mjs < changed.txt)" >> "$GITHUB_OUTPUT"

  # The interface tests (npm run test:ui): real Chromium and WebKit against a
  # production build, with GitHub faked. Playwright's report is kept for 7
  # days when a test fails.
  # Pull requests that can reach the app only; they stop after 15 minutes
  # rather than hang (a normal run takes 4 to 5).
  interface:
    needs: [scope]
    if: github.event_name == 'pull_request' && needs.scope.outputs.website_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # GitHub Pages, when there are no Cloudflare secrets.
  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.cloudflare != 'true'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Cloudflare, when its secrets are set: build again from the same commit and
  # upload dist/ with Wrangler (wrangler.jsonc). The token can only edit Workers.
  deploy-cloudflare:
    if: github.event_name != 'pull_request' && needs.build.outputs.cloudflare == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.163.0
          command: deploy
