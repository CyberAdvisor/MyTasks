# Publish My Tasks to GitHub Pages at https://mytasks.fyi (NFR-13).
# Every pull request and every push to main is checked, tested and built;
# only a push to main is deployed, and a failing step stops the deploy.
# Requires Settings › Pages › Source: GitHub Actions.
#
# Actions are pinned to full commit hashes (the version is in the comment),
# so a moved tag can't change what runs. Dependabot keeps them up to date.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job gets the rights to publish.
permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy mid-way.
# Pull requests get their own group, so they never hold up a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in the packages the app ships (not the build tools).
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run check
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
